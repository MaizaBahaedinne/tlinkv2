name: Mobile Android

# Compile les applications Android (APK de test) sur les serveurs GitHub : aucun outil à installer sur le Mac.
# Lancement : GitHub > Actions > « Mobile Android » > Run workflow. Les APK sont à télécharger dans les artefacts du run.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Application à compiler"
        required: true
        default: all
        type: choice
        options:
          - all
          - link
          - store
          - academy
          - messenger

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [link, store, academy, messenger]
    steps:
      - name: Application demandée ?
        id: wanted
        run: echo "build=${{ (inputs.app == 'all' || inputs.app == matrix.app) && 'yes' || 'no' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.wanted.outputs.build == 'yes'

      - uses: actions/setup-node@v7
        if: steps.wanted.outputs.build == 'yes'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        if: steps.wanted.outputs.build == 'yes'
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances JavaScript
        if: steps.wanted.outputs.build == 'yes'
        run: npm ci

      - name: Synchroniser Capacitor
        if: steps.wanted.outputs.build == 'yes'
        run: CAP_APP=${{ matrix.app }} npx cap sync android

      - name: Firebase (notifications push)
        if: steps.wanted.outputs.build == 'yes'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Secret GOOGLE_SERVICES_JSON absent : APK sans notifications push."
            exit 0
          fi

          target=mobile/${{ matrix.app }}/android/app/google-services.json
          trimmed=$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]')

          # Le secret peut être le JSON brut ou son encodage base64 (espaces et retours à la ligne ignorés).
          if [ "${trimmed:0:1}" = "{" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$target"
          else
            printf '%s' "$trimmed" | base64 --decode > "$target" 2>/dev/null || true
          fi

          if python3 -c "import json,sys; d=json.load(open('$target')); sys.exit(0 if d.get('client') else 1)" 2>/dev/null; then
            echo "google-services.json installé : notifications push actives."
          else
            rm -f "$target"
            echo "::warning::Secret GOOGLE_SERVICES_JSON invalide (ni JSON, ni base64 de google-services.json) : APK sans notifications push."
          fi

      - name: Signature stable (liens vers l'application)
        if: steps.wanted.outputs.build == 'yes'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::warning::Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD et ANDROID_KEY_ALIAS absents : signature de test aleatoire, Android n'ouvrira pas l'application depuis les liens du site (voir docs/mobile-capacitor.md)."
            exit 0
          fi

          keystore="$RUNNER_TEMP/tlink.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore"

          {
            echo "TLINK_KEYSTORE_FILE=$keystore"
            echo "TLINK_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "TLINK_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "TLINK_KEY_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Signature stable activee."

      - name: Compiler l'APK de test
        if: steps.wanted.outputs.build == 'yes'
        working-directory: mobile/${{ matrix.app }}/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Empreinte de signature (ANDROID_CERT_FINGERPRINTS)
        if: steps.wanted.outputs.build == 'yes'
        run: |
          echo "Empreinte SHA-256 de ${{ matrix.app }} (a mettre dans ANDROID_CERT_FINGERPRINTS sur le serveur) :"
          keytool -printcert -jarfile mobile/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk | grep 'SHA256'

      - name: Publier l'APK
        if: steps.wanted.outputs.build == 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: tunivisions-${{ matrix.app }}-debug-apk
          path: mobile/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
